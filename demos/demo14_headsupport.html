<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 14 — Hlava jako bod opory</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }
        #info { position: absolute; top: 10px; left: 0; right: 0;
                text-align: center; pointer-events: none;
                text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 4px 0; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.9em; }
        /* Dva textové panely pro stats — jeden vlevo, jeden vpravo */
        .stats { position: absolute; bottom: 10px;
                 background: rgba(0,0,0,0.55); padding: 10px 14px;
                 border-radius: 6px; font-size: 0.85em; line-height: 1.5;
                 min-width: 220px; }
        #statsL { left: 10px; }
        #statsR { right: 10px; text-align: right; }
        .ok  { color: #44ff66; font-weight: bold; }
        .bad { color: #ff4444; font-weight: bold; }
        .label { color: #88ccff; }
    </style>
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
    <div id="info">
        <h2>Demo 14 — Hlava jako bod opory</h2>
        <p>Vlevo Pincha s temenem (hlava + oba lokty). Vpravo Kapalásana (hlava + obě dlaně).</p>
    </div>

    <div id="statsL" class="stats"></div>
    <div id="statsR" class="stats"></div>

    <script type="module">
        import { Skeleton }     from '../src/model/Skeleton.js';
        import { StickmanView } from '../src/view/StickmanView.js';
        import { BasicScene }   from '../src/scene/BasicScene.js';
        import { pincha, kapalasana } from '../src/library/Poses.js';

        // === 1. Scéna ===
        // Společná podlaha + kamera vidí obě postavy najednou.
        const H = 8;
        const FLOOR_Y = -H / 2;
        const scene = new BasicScene({
            cameraHeight: -1, cameraDistance: 30,    // mírně z dolu, ať vidíme support polygon
            floorY: FLOOR_Y,
        });

        // PelvisY tak, aby SPODEK SFÉRY HLAVY ležel přesně na FLOOR_Y po flipu.
        // Odvození pro rootRotation.x=180 + neck.x=60° anatomic (sign=-1, tj. Three.js -60°):
        //   headTop.world.y = pelvisY - (TORSO + 2*HR*cos60°)
        //   spodek sféry  = headTop.world.y - HR (rotace neck posune střed sféry o cos60° od pivotu)
        // Spodek sféry = pelvisY - (TORSO + 2HR*cos60° + HR) = pelvisY - 3.31 (pro H=8).
        // Chceme = FLOOR_Y → pelvisY = FLOOR_Y + 3.31. Pro FLOOR_Y=-4 → pelvisY ≈ -0.69.
        const PELVIS_Y = FLOOR_Y + 3.31;

        /**
         * Postaví jednu postavu na danou X-pozici. Aplikuje pose, pak ručně nastaví
         * root transformaci tak, aby hlava sedla na podlahu.
         */
        function buildFigure(xOffset, pose) {
            const skel = new Skeleton(H);
            const view = new StickmanView(skel);

            // 1) Pose definuje úhly + supportPoints. ALE: pose.apply() volá skel.reset(),
            //    který smaže rootRotation/rootPosition → musíme je nastavit AŽ POTOM.
            pose.apply(skel);

            // 2) Vzhůru nohama (rotace kolem +X o 180°): postava se otočí, hlava míří dolů.
            skel.rootRotation.x = 180;

            // 3) Posun do strany + výška tak, aby spodek hlavy byl na podlaze.
            //    Záměrně NEvoláme snapToFloor — ta by srovnala nejnižší support pivot
            //    (lokty/zápěstí jsou geometricky níž než hlava), čímž by hlava skončila
            //    ve vzduchu. My chceme opak: hlava na zemi, ostatní support body
            //    případně visí nad/pod (geometrický limit kostry bez lumbar jointu).
            skel.rootPosition.x = xOffset;
            skel.rootPosition.y = PELVIS_Y;

            scene.scene.add(view.group);

            // Markery — CoM se sférou + svislou čárou (= projekce na podlahu),
            // support polygon spojí body opory na podlaze.
            const comMarker     = view.createCenterOfMassMarker(FLOOR_Y);
            const supportMarker = view.createSupportPolygonMarker(FLOOR_Y);
            scene.scene.add(comMarker);
            scene.scene.add(supportMarker);

            return { skel, view, comMarker, supportMarker };
        }

        // === 2. Dvě postavy ===
        // Offset ±6 v X — Kapalásana má paže až 4.44 j do strany, postavy by se prolínaly
        // při menším rozestupu.
        const figL = buildFigure(-6, pincha);     // levá: tripod hlava + lokty
        const figR = buildFigure(+6, kapalasana); // pravá: tripod hlava + dlaně

        // === 3. UI: stats text pro každou postavu ===
        const statsL = document.getElementById('statsL');
        const statsR = document.getElementById('statsR');

        /** Aktualizuje text pro jednu postavu (= stability info). */
        function renderStats(el, fig, title) {
            const com    = fig.skel.getCenterOfMass();
            const stable = fig.skel.isStable();
            const sp     = fig.skel.supportPoints.join(', ');
            // CoM XZ projekce (rovina podlahy)
            el.innerHTML = `
                <div><strong>${title}</strong></div>
                <div><span class="label">Body opory:</span> ${sp}</div>
                <div><span class="label">CoM (X, Z):</span> ${com.x.toFixed(2)}, ${com.z.toFixed(2)}</div>
                <div><span class="label">Stabilní?</span>
                    <span class="${stable ? 'ok' : 'bad'}">
                        ${stable ? 'ANO' : 'NE'}
                    </span>
                </div>
            `;
        }

        // === 4. Smyčka — postavy jsou statické, jen markery + stats ===
        scene.onUpdate(() => {
            // updateCenterOfMassMarker(marker, true) = obarví podle stability
            figL.view.update();
            figL.view.updateCenterOfMassMarker(figL.comMarker, true);
            figL.view.updateSupportPolygonMarker(figL.supportMarker);

            figR.view.update();
            figR.view.updateCenterOfMassMarker(figR.comMarker, true);
            figR.view.updateSupportPolygonMarker(figR.supportMarker);

            renderStats(statsL, figL, 'Vlevo: Pincha (hlava + lokty)');
            renderStats(statsR, figR, 'Vpravo: Kapalásana (hlava + dlaně)');
        });
        scene.start();
    </script>
</body>
</html>
