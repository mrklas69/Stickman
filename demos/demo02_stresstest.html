<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 02 — Stress test (F2 prototyp)</title>
    <link rel="icon" href="data:,">                  <!-- KISS: zabrání 404 favicon -->

    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }

        /* === Layout: stejný 3-column grid jako Demo 01 (izomorfismus) === */
        #app {
            position: relative;
            display: grid;
            grid-template-columns: 200px 1fr 320px;
            grid-template-areas: "left viewport right";
            height: 100vh;
            width: 100vw;
        }
        #viewport     { grid-area: viewport; position: relative;
                        min-width: 0; min-height: 0; overflow: hidden; }
        #panel-left   { grid-area: left;   background: #22222b; border-right: 1px solid #444;
                        overflow-y: auto; padding: 14px 12px; box-sizing: border-box; }
        #panel-right  { grid-area: right;  background: #22222b; border-left: 1px solid #444;
                        overflow-y: auto; padding: 14px 14px; box-sizing: border-box; }

        /* Hlavička v rohu viewportu */
        #info { position: absolute; top: 10px; left: 10px;
                pointer-events: none; text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 2px 0; font-size: 1.05em; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.82em; }

        /* === Panel-left: stejný styling jako demo01 === */
        #panel-left h3 { margin: 0 0 10px 0; color: #ffaa66;
                         font-size: 0.85em; text-transform: uppercase;
                         letter-spacing: 0.5px; }
        #panel-left h4.pose-section { margin: 14px 0 8px 0;
                                       color: #ffaa66;
                                       font-size: 0.85em;
                                       text-transform: uppercase;
                                       letter-spacing: 0.5px;
                                       font-weight: normal;
                                       border-top: 1px solid #333; padding-top: 12px; }
        .pose-btn {
            display: block; width: 100%; padding: 8px 10px;
            background: #2a2a35; color: #ddd; border: 1px solid #3a3a45;
            border-radius: 4px; cursor: pointer; margin-bottom: 4px;
            text-align: left; font-size: 0.85em;
        }
        .pose-btn:hover  { background: #3a3a45; }
        .pose-btn.active { background: #ffaa66; color: #1a1a22; border-color: #ffaa66; }

        /* === Panel-right: stejný styling jako demo01 (slidery) === */
        #panel-right h3 { margin: 0 0 8px 0; color: #ffaa66;
                          font-size: 0.85em; text-transform: uppercase;
                          letter-spacing: 0.5px; }
        #panel-right .group h3 { margin: 0 0 6px 0;
                                  font-family: monospace; color: #88ccff;
                                  font-size: 0.85em;
                                  text-transform: none; letter-spacing: 0; }
        .group { margin-bottom: 12px; padding-bottom: 8px;
                 border-bottom: 1px solid #333; }
        .group:last-child { border-bottom: 0; }
        .row { display: flex; align-items: center; margin: 3px 0; gap: 6px;
               font-size: 0.78em; }
        .row label { width: 92px; color: #ccc; font-family: monospace;
                     font-size: 14px; }
        .row input[type=range] { flex: 1; min-width: 0; accent-color: #ffaa66; }
        .row .value { width: 44px; text-align: right; font-family: monospace;
                      color: #88ccff; }
    </style>
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
<div id="app">
    <!-- Levý panel: pózy (Reset/Dance/Drift) + status (Walk/Jog/Sprint) -->
    <div id="panel-left">
        <h3>Pózy</h3>
        <div id="poses-list"></div>

        <h4 class="pose-section">Status</h4>
        <div id="status-list"></div>
    </div>

    <!-- Hlavní viewport (3D scéna) -->
    <div id="viewport">
        <div id="info">
            <h2>Demo 02 — Stress test</h2>
            <p>Reset / Dance / Drift / Walk / Jog / Sprint. Dýchání + Neklid = globální overlay přes vše.</p>
        </div>
    </div>

    <!-- Pravý panel: globální Neklid (overlay nad jakoukoli animaci) -->
    <div id="panel-right">
        <h3>Globální</h3>
        <div id="params-container"></div>
    </div>
</div>

<script type="module">
    import { Skeleton }     from '../src/model/Skeleton.js';
    import { StickmanView } from '../src/view/StickmanView.js';
    import { DebugView }    from '../src/view/DebugView.js';
    import { BasicScene }   from '../src/scene/BasicScene.js';
    import { Stickman }     from '../src/character/Stickman.js';
    import { Status }       from '../src/character/Status.js';
    import { applyNeklid }  from '../src/util/Neklid.js';
    import { applyBreathing } from '../src/util/Breathing.js';
    import {
        DEFAULTS_WALK, RUN_PRESETS, DEFAULTS_DRIFT, DEFAULTS_CRAWL,
        DEFAULTS_PRONE, DEFAULTS_SNEAK,
    } from '../src/character/Animations.js';

    // =========================================================================
    // 1. Model + scéna + view (stejné nastavení jako demo01 = izomorfismus)
    // =========================================================================
    const H = 8;
    const FLOOR_Y = -H / 2;
    const skel = new Skeleton(H);
    const view = new StickmanView(skel);

    const viewport = document.getElementById('viewport');
    const scene = new BasicScene({
        cameraHeight: 0,
        cameraDistance: 18,
        container: viewport,
        floorY: FLOOR_Y,
    });
    scene.scene.add(view.group);

    // =========================================================================
    // 2. DebugView — všechny vrstvy ON (jako v demo01)
    // =========================================================================
    const debug = new DebugView(view, { floorY: FLOOR_Y });
    debug.attachToScene(scene.scene);
    debug.setRaycaster(scene.renderer.domElement, scene.camera);
    debug.setVisible('com', true);
    debug.setVisible('gravity', true);
    debug.setVisible('body', true);
    debug.setVisible('tooltip', true);

    // =========================================================================
    // 3. Stickman wrapper — drží status + animace + plynulé přechody
    // =========================================================================
    const stickman = new Stickman(skel, Status.STAND, {});

    // Globální čas pro Neklid overlay (kontinuální napříč setStatus přechody;
    // stickman.time se resetuje při setStatus, ale Neklid musí běžet plynule).
    let globalTime = 0;

    // Overlay levely — řízené slidery v pravém panelu. 0 = no-op.
    let neklidLevel = 0;
    let breathingLevel = 0;

    // =========================================================================
    // 4. Pravý panel — slidery (zatím jen Neklid; další parametry přidáme,
    //    až budeme cítit, že chybí).
    // =========================================================================
    const paramsContainer = document.getElementById('params-container');

    function addGroup(title) {
        const g = document.createElement('div');
        g.className = 'group';
        const h = document.createElement('h3');
        h.textContent = title;
        g.appendChild(h);
        paramsContainer.appendChild(g);
        return g;
    }

    /** Slider helper — onChange(v) volá při tažení. */
    function addSlider(parent, label, min, max, step, initial, onChange) {
        const row = document.createElement('div');
        row.className = 'row';
        const decimals = step < 1 ? 1 : 0;
        row.innerHTML = `
            <label>${label}</label>
            <input type="range" min="${min}" max="${max}" step="${step}" value="${initial}">
            <span class="value">${initial.toFixed(decimals)}</span>
        `;
        const input = row.querySelector('input');
        const valueEl = row.querySelector('.value');
        input.addEventListener('input', () => {
            const v = parseFloat(input.value);
            valueEl.textContent = v.toFixed(decimals);
            onChange(v);
        });
        parent.appendChild(row);
    }

    // === Dýchání sekce ===
    // Pomalá sinusoida ~0.25 Hz (= 15 dechů/min) na torso.x + neck.x.
    // Biologicky koherentní (jeden společný phase, ne nezávislý hash) →
    // hrudník + hlava se hýbou ve fázi.
    const breathingGroup = addGroup('Dýchání');
    addSlider(breathingGroup, 'Intenzita', 0, 10, 0.5, 0,
        (v) => { breathingLevel = v; },
    );

    // === Neklid sekce ===
    // 0 = no-op, 10 = max výchylka (~5° per kloub) na vrchu těla. Aplikuje se
    // PO Stickman.animate v render loopu — funguje pro VŠECHNY režimy
    // (Walk, Sprint, Drift, Reset, …). Dolní polovina + rootRotation
    // se nehýbou (Sezení 9 fix).
    const neklidGroup = addGroup('Neklid');
    addSlider(neklidGroup, 'Intenzita', 0, 10, 0.5, 0,
        (v) => { neklidLevel = v; },
    );

    // =========================================================================
    // 5. Levý panel — tlačítka (stejný layout jako demo01)
    // =========================================================================
    const posesContainer  = document.getElementById('poses-list');
    const statusContainer = document.getElementById('status-list');
    const buttons = {};

    function addBtn(parent, key, label, onClick) {
        const btn = document.createElement('button');
        btn.className = 'pose-btn';
        btn.textContent = label;
        btn.addEventListener('click', () => {
            for (const k in buttons) buttons[k].classList.toggle('active', k === key);
            onClick();
        });
        parent.appendChild(btn);
        buttons[key] = btn;
    }

    // === Dance preset — Drift v rytmu, omezený root ===
    // Dance NENÍ vlastní animace, je to konfigurační preset Status.STAND idle.
    // Klíčové parametry:
    //   - cycleDuration = 60/110 ≈ 0.545 s (= jeden beat při 110 BPM)
    //   - fraction = 0.5 (= 2× Drift; větší swing per cyklus = "divočejší")
    //   - rootRange = 8° (omezené kývání trupu, postava neztratí stabilitu)
    //
    // Pokud chceš jiné BPM, změň `BPM_DANCE` níže. Pro draft bez sliderem.
    const BPM_DANCE = 110;
    const DANCE_PRESET = {
        idle: true,
        fraction: 0.5,
        cycleDuration: 60 / BPM_DANCE,
        rootRange: 8,
    };

    // === PÓZY: Reset, Dance, Drift ===
    // Pořadí: Reset (static) → Dance (rhythmic, constrained root) → Drift
    // (open random walk, plný root ±90°). Postupně rostoucí volnost.
    addBtn(posesContainer, 'reset', 'Reset',
        () => stickman.setStatus(Status.STAND, {}));

    addBtn(posesContainer, 'dance', 'Dance',
        () => stickman.setStatus(Status.STAND, { ...DANCE_PRESET }));

    addBtn(posesContainer, 'drift', 'Drift',
        () => stickman.setStatus(Status.STAND, { ...DEFAULTS_DRIFT }));

    // === STATUS: Walk, Jog, Sprint, Po čtyřech ===
    addBtn(statusContainer, 'walk', 'Walk',
        () => stickman.setStatus(Status.WALK, { ...DEFAULTS_WALK }));
    addBtn(statusContainer, 'jog', 'Jog',
        () => stickman.setStatus(Status.RUN, { ...RUN_PRESETS.jog }));
    addBtn(statusContainer, 'sprint', 'Sprint',
        () => stickman.setStatus(Status.RUN, { ...RUN_PRESETS.sprint }));
    addBtn(statusContainer, 'crawl', 'Po čtyřech',
        () => stickman.setStatus(Status.CRAWL, { ...DEFAULTS_CRAWL }));
    addBtn(statusContainer, 'prone', 'Plížení',
        () => stickman.setStatus(Status.PRONE, { ...DEFAULTS_PRONE }));
    addBtn(statusContainer, 'sneak', 'Přikrčená chůze',
        () => stickman.setStatus(Status.SNEAK, { ...DEFAULTS_SNEAK }));

    buttons.reset.classList.add('active');

    // =========================================================================
    // 6. Render loop — Stickman.animate primární, applyNeklid overlay,
    //    snap-to-floor na konec.
    // =========================================================================
    skel.snapToFloor(FLOOR_Y);
    view.update();

    scene.onUpdate((dt) => {
        globalTime += dt;
        stickman.animate(dt);                              // 1. primární animace
        applyBreathing(skel, globalTime, breathingLevel);  // 2a. dýchání overlay (torso.x + neck.x)
        applyNeklid(skel, globalTime, neklidLevel);        // 2b. fidget overlay (vrch těla)
        skel.snapToFloor(FLOOR_Y);                         // 3. drž na podlaze
        view.update();
        debug.update();
    });
    scene.start();
</script>
</body>
</html>
