<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 06 — Body opory & rovnováha</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }
        #info { position: absolute; top: 10px; left: 0; right: 0;
                text-align: center; pointer-events: none;
                text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 4px 0; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.9em; }
        #controls { position: absolute; top: 80px; right: 20px;
                    display: flex; flex-direction: column; gap: 6px; z-index: 100; }
        #controls button {
            padding: 10px 18px; background: #2a2a35; color: #ddd;
            border: 1px solid #444; border-radius: 6px; cursor: pointer;
            font-size: 1em; min-width: 170px; text-align: left;
        }
        #controls button:hover  { background: #3a3a45; }
        #controls button.active { background: #ffaa66; color: #1a1a22; border-color: #ffaa66; }
        #stats { position: absolute; bottom: 10px; left: 10px;
                 background: rgba(0,0,0,0.55); padding: 10px 14px;
                 border-radius: 6px; font-size: 0.85em; line-height: 1.55;
                 min-width: 220px; }
        .ok   { color: #44ff66; font-weight: bold; }
        .bad  { color: #ff4444; font-weight: bold; }
        .com    { color: #44ff66; font-family: monospace; }
        .anchor { color: #ffaa44; font-family: monospace; }
        #legend { position: absolute; bottom: 10px; right: 20px;
                  background: rgba(0,0,0,0.55); padding: 8px 12px;
                  border-radius: 6px; font-size: 0.8em; line-height: 1.7; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
               vertical-align: middle; margin-right: 6px; }
    </style>
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
    <div id="info">
        <h2>Demo 06 — Body opory &amp; rovnováha</h2>
        <p>CoM zelený = projekce uvnitř podpůrného polygonu (stabilní). Červený = mimo (padá).</p>
    </div>
    <div id="controls"></div>
    <div id="stats"></div>
    <div id="legend">
        <div><span class="dot" style="background:#44ff66"></span> Stabilní (CoM uvnitř)</div>
        <div><span class="dot" style="background:#ff4444"></span> Nestabilní (CoM mimo)</div>
        <div><span class="dot" style="background:#ffaa44"></span> Body opory + polygon</div>
    </div>

    <script type="module">
        import { Skeleton }     from '../src/model/Skeleton.js';
        import { StickmanView } from '../src/view/StickmanView.js';
        import { BasicScene }   from '../src/scene/BasicScene.js';
        import { stand, tpose, wave, leanForward, oneLegL, oneLegR, lunge } from '../src/library/Poses.js';

        // === 1. Setup ===
        const H = 8;
        const FLOOR_Y = -H / 2;
        const skel  = new Skeleton(H);
        const view  = new StickmanView(skel);
        const scene = new BasicScene({ cameraHeight: 0, cameraDistance: 18 });
        scene.scene.add(view.group);

        // Vizualizace: CoM marker + support polygon marker
        const comMarker     = view.createCenterOfMassMarker(FLOOR_Y);
        const supportMarker = view.createSupportPolygonMarker(FLOOR_Y);
        scene.scene.add(comMarker);
        scene.scene.add(supportMarker);

        // === 2. Pózy z knihovny ===
        const POSES = {
            stand,
            tpose,
            wave,
            lean_fwd:  leanForward,
            one_leg_L: oneLegL,
            one_leg_R: oneLegR,
            step_fwd:  lunge,
        };

        // === 3. UI ===
        const ui = document.getElementById('controls');
        const statsEl = document.getElementById('stats');
        const buttons = {};
        let currentKey = 'stand';

        function activate(key) {
            const pose = POSES[key];
            pose.apply(skel);
            view.update();
            view.updateCenterOfMassMarker(comMarker, true);   // colorByStability
            view.updateSupportPolygonMarker(supportMarker);
            updateStats();
            currentKey = key;
            Object.values(buttons).forEach(b => b.classList.remove('active'));
            buttons[key].classList.add('active');
        }

        function updateStats() {
            const com = skel.getCenterOfMass();
            const stable = skel.isStable();
            const sp = skel.supportPoints.join(', ');
            const pose = POSES[currentKey];
            statsEl.innerHTML = `
                <div><strong>Aktivní:</strong> ${pose.name}</div>
                <div><strong>Stabilita:</strong>
                    <span class="${stable ? 'ok' : 'bad'}">
                        ${stable ? 'STABILNÍ' : 'PADÁ'}
                    </span>
                </div>
                <div><strong>CoM (xz):</strong> <span class="com">
                    x=${com.x.toFixed(2)}, z=${com.z.toFixed(2)}
                </span></div>
                <div><strong>Body opory:</strong> <span class="anchor">${sp}</span></div>
            `;
        }

        Object.entries(POSES).forEach(([key, pose]) => {
            const btn = document.createElement('button');
            btn.textContent = pose.name;
            btn.addEventListener('click', () => activate(key));
            ui.appendChild(btn);
            buttons[key] = btn;
        });

        scene.onUpdate(() => {
            view.update();
            // Pokud bys chtěl markery aktualizovat každý frame (např. pro animace),
            // odkomentuj. Pro statické pózy stačí update jen při aktivaci.
            // view.updateCenterOfMassMarker(comMarker, true);
            // view.updateSupportPolygonMarker(supportMarker);
        });
        scene.start();
        activate('stand');
    </script>
</body>
</html>
