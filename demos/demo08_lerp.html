<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 08 — Pose interpolace</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }
        #info { position: absolute; top: 10px; left: 0; right: 0;
                text-align: center; pointer-events: none;
                text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 4px 0; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.9em; }

        #controls { position: absolute; top: 80px; right: 20px;
                    display: flex; flex-direction: column; gap: 6px; z-index: 100; }
        #controls button {
            padding: 10px 18px; background: #2a2a35; color: #ddd;
            border: 1px solid #444; border-radius: 6px; cursor: pointer;
            font-size: 1em; min-width: 180px; text-align: left;
        }
        #controls button:hover  { background: #3a3a45; }
        #controls button.active { background: #ffaa66; color: #1a1a22; border-color: #ffaa66; }

        #panel { position: absolute; top: 80px; left: 20px;
                 background: #2a2a35; padding: 14px 16px;
                 border-radius: 6px; border: 1px solid #444;
                 width: 240px; z-index: 100; }
        #panel h3 { margin: 0 0 10px 0; color: #ffaa66; font-size: 0.95em; }
        .field { display: flex; align-items: center; margin: 8px 0; gap: 10px;
                 font-size: 0.85em; }
        .field label { width: 80px; }
        .field input[type=range] { flex: 1; min-width: 0; accent-color: #ffaa66; }
        .field .v { width: 44px; font-family: monospace; color: #88ccff; text-align: right; }
        .toggle { display: flex; align-items: center; gap: 8px; margin: 10px 0;
                  cursor: pointer; user-select: none; }
        .toggle .led { width: 12px; height: 12px; border-radius: 50%;
                       background: #444; border: 1px solid #666; }
        .toggle.on .led { background: #44ff66; border-color: #44ff66;
                          box-shadow: 0 0 6px #44ff66; }

        #stats { position: absolute; bottom: 10px; left: 10px;
                 background: rgba(0,0,0,0.55); padding: 10px 14px;
                 border-radius: 6px; font-size: 0.85em; line-height: 1.55;
                 min-width: 240px; }
        .ok  { color: #44ff66; font-weight: bold; }
        .bad { color: #ff4444; font-weight: bold; }
        .progress {
            display: inline-block; width: 80px; height: 6px;
            background: #333; border-radius: 3px; vertical-align: middle;
            margin-left: 6px; overflow: hidden;
        }
        .progress > div { height: 100%; background: #ffaa66; transition: none; }
    </style>
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
    <div id="info">
        <h2>Demo 08 — Pose interpolace</h2>
        <p>Klik na pózu = plynulý přechod z aktuálního stavu. Slider mění dobu trvání.</p>
    </div>

    <div id="panel">
        <h3>Nastavení</h3>
        <div class="field">
            <label>Doba</label>
            <input id="duration" type="range" min="0.1" max="3.0" step="0.1" value="0.8">
            <span class="v" id="durVal">0.8s</span>
        </div>
        <div class="toggle on" id="snapToggle">
            <div class="led"></div><span>Snap to floor</span>
        </div>
        <div class="toggle on" id="easeToggle">
            <div class="led"></div><span>Smooth ease</span>
        </div>
    </div>

    <div id="controls"></div>
    <div id="stats"></div>

    <script type="module">
        import { Skeleton }     from '../src/model/Skeleton.js';
        import { StickmanView } from '../src/view/StickmanView.js';
        import { BasicScene }   from '../src/scene/BasicScene.js';
        import { Pose }         from '../src/model/Pose.js';
        import { stand, tpose, wave, squat, sitLegsForward, oneLegL, lunge } from '../src/library/Poses.js';

        // === 1. Setup scény ===
        const H = 8;
        const FLOOR_Y = -H / 2;
        const skel  = new Skeleton(H);
        const view  = new StickmanView(skel);
        const scene = new BasicScene({
            cameraHeight: 0, cameraDistance: 18,
            floorY: FLOOR_Y,
        });
        scene.scene.add(view.group);

        // Vizualizace markerů
        const comMarker     = view.createCenterOfMassMarker(FLOOR_Y);
        const supportMarker = view.createSupportPolygonMarker(FLOOR_Y);
        scene.scene.add(comMarker);
        scene.scene.add(supportMarker);

        // === 2. Pózy z knihovny ===
        const POSES = {
            stand,
            tpose,
            wave,
            squat,
            sit_legs_fwd: sitLegsForward,
            one_leg_L:    oneLegL,
            lunge,
        };

        // === 3. Stav přechodu ===
        // currentPose = výchozí stav přechodu (snapshot v okamžiku kliku)
        // targetPose  = cílová pose (Pose objekt z POSES)
        // transitionStart = čas startu, -1 = žádný transition neprobíhá
        let currentPose      = POSES.stand;
        let targetPose       = POSES.stand;
        let transitionStart  = -1;
        let transitionProgress = 1;     // pro zobrazení v statbaru
        let currentKey       = 'stand';

        // === 4. Nastavení (UI elementy) ===
        let duration   = 0.8;        // sekund
        let snapEnabled = true;
        let easeEnabled = true;

        // smoothstep = klasický easing 3t² - 2t³ (plynulý vstup i výstup)
        // Bez něj se postava rovnoměrně otáčí, s ním se "rozjede a dobrzdí"
        const smoothstep = (t) => t * t * (3 - 2 * t);

        // === 5. Spuštění přechodu ===
        function startTransition(newKey, time) {
            // Snapshot AKTUÁLNÍ pózy ze skel — i když transition uprostřed,
            // vezmeme okamžitý stav (ne POSES[currentKey], protože ten je "ideální")
            currentPose      = Pose.capture(skel, '');
            targetPose       = POSES[newKey];
            transitionStart  = time;
            currentKey       = newKey;
            // UI
            Object.values(buttons).forEach(b => b.classList.remove('active'));
            buttons[newKey].classList.add('active');
        }

        // === 6. Frame update ===
        scene.onUpdate((delta, time) => {
            // Probíhá přechod?
            if (transitionStart >= 0) {
                const elapsed = time - transitionStart;
                let t = Math.min(1, elapsed / duration);
                const tEased = easeEnabled ? smoothstep(t) : t;
                // Vyrobíme intermediální Pose a aplikujeme ji
                Pose.lerp(currentPose, targetPose, tEased).apply(skel);
                if (snapEnabled) skel.snapToFloor(FLOOR_Y);
                transitionProgress = t;
                if (t >= 1) transitionStart = -1;        // konec
            }
            view.update();
            view.updateCenterOfMassMarker(comMarker, true);
            view.updateSupportPolygonMarker(supportMarker);
            updateStats();
        });

        function updateStats() {
            const com = skel.getCenterOfMass();
            const stable = skel.isStable();
            statsEl.innerHTML = `
                <div><strong>Cíl:</strong> ${POSES[currentKey].name}</div>
                <div><strong>Postup:</strong> ${(transitionProgress * 100).toFixed(0)} %
                    <span class="progress"><div style="width: ${(transitionProgress*100).toFixed(0)}%"></div></span>
                </div>
                <div><strong>Stabilita:</strong>
                    <span class="${stable ? 'ok' : 'bad'}">${stable ? 'STABILNÍ' : 'PADÁ'}</span>
                </div>
                <div><strong>CoM (xz):</strong> x=${com.x.toFixed(2)}, z=${com.z.toFixed(2)}</div>
            `;
        }

        // === 7. UI: tlačítka póz ===
        const ui = document.getElementById('controls');
        const statsEl = document.getElementById('stats');
        const buttons = {};

        Object.entries(POSES).forEach(([key, pose]) => {
            const btn = document.createElement('button');
            btn.textContent = pose.name;
            // performance.now()/1000 = sekundy od startu, kompatibilní s clockem v BasicScene
            btn.addEventListener('click', () => startTransition(key, performance.now() / 1000));
            ui.appendChild(btn);
            buttons[key] = btn;
        });

        // === 8. UI: doba trvání + toggly ===
        const durationInput = document.getElementById('duration');
        const durationVal   = document.getElementById('durVal');
        durationInput.addEventListener('input', () => {
            duration = parseFloat(durationInput.value);
            durationVal.textContent = duration.toFixed(1) + 's';
        });

        const snapToggle = document.getElementById('snapToggle');
        snapToggle.addEventListener('click', () => {
            snapEnabled = !snapEnabled;
            snapToggle.classList.toggle('on', snapEnabled);
        });

        const easeToggle = document.getElementById('easeToggle');
        easeToggle.addEventListener('click', () => {
            easeEnabled = !easeEnabled;
            easeToggle.classList.toggle('on', easeEnabled);
        });

        // === 9. Start ===
        // Inicializuj na rest pose, ale stav transitionStart = -1 (nic se nehraje)
        POSES.stand.apply(skel);
        if (snapEnabled) skel.snapToFloor(FLOOR_Y);
        buttons.stand.classList.add('active');
        scene.start();
    </script>
</body>
</html>
