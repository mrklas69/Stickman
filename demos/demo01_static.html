<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 01 — Statická rest pose</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }
        #info { position: absolute; top: 10px; left: 0; right: 0;
                text-align: center; pointer-events: none;
                text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 4px 0; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.9em; }
        #stats { position: absolute; bottom: 10px; left: 10px;
                 background: rgba(0,0,0,0.5); padding: 8px 12px;
                 border-radius: 6px; font-size: 0.85em; }
    </style>
    <!-- Import maps = překlad bare-specifierů ('three') na URL.
         Funguje nativně v moderních prohlížečích, žádný build-tool. -->
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
    <div id="info">
        <h2>Demo 01 — Rest pose</h2>
        <p>Postava v anatomické nule (všechny úhly = 0). Tažením myši otáčej kameru.</p>
    </div>
    <div id="stats"></div>

    <script type="module">
        import { Skeleton }      from '../src/model/Skeleton.js';
        import { StickmanView }  from '../src/view/StickmanView.js';
        import { BasicScene }    from '../src/scene/BasicScene.js';

        // 1. Vytvoříme model (kostru) výšky 8 jednotek
        const skel = new Skeleton(8);

        // 2. Vytvoříme view a přidáme do scény
        const view  = new StickmanView(skel);
        const scene = new BasicScene({ cameraHeight: 0, cameraDistance: 18 });
        scene.scene.add(view.group);

        // 3. Každý frame sync view ← model (zatím se model nemění,
        //    ale je to ready pro animace v dalších demech)
        scene.onUpdate(() => view.update());

        // 4. Diagnostika do statbaru
        const stats = document.getElementById('stats');
        stats.innerHTML =
            `<strong>Skeleton:</strong> ${Object.keys(skel.joints).length} kloubů, ` +
            `${skel.totalDOF} DOF<br>` +
            `<strong>Výška H:</strong> ${skel.H} jednotek`;

        scene.start();
    </script>
</body>
</html>
