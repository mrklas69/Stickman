<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 05 — Center of Mass</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }
        #info { position: absolute; top: 10px; left: 0; right: 0;
                text-align: center; pointer-events: none;
                text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 4px 0; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.9em; }
        #controls { position: absolute; top: 80px; right: 20px;
                    display: flex; flex-direction: column; gap: 6px; z-index: 100; }
        #controls button {
            padding: 10px 18px; background: #2a2a35; color: #ddd;
            border: 1px solid #444; border-radius: 6px; cursor: pointer;
            font-size: 1em; min-width: 130px; text-align: left;
        }
        #controls button:hover  { background: #3a3a45; }
        #controls button.active { background: #ffaa66; color: #1a1a22; border-color: #ffaa66; }
        #stats { position: absolute; bottom: 10px; left: 10px;
                 background: rgba(0,0,0,0.5); padding: 10px 14px;
                 border-radius: 6px; font-size: 0.85em; line-height: 1.5; }
        #stats .com { color: #44ff66; font-family: monospace; }
    </style>
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
    <div id="info">
        <h2>Demo 05 — Center of Mass</h2>
        <p>Zelená sféra = těžiště. Křížek na podlaze = jeho horizontální projekce.</p>
    </div>
    <div id="controls"></div>
    <div id="stats"></div>

    <script type="module">
        import { Skeleton }     from '../src/model/Skeleton.js';
        import { StickmanView } from '../src/view/StickmanView.js';
        import { BasicScene }   from '../src/scene/BasicScene.js';
        import { Pose }         from '../src/model/Pose.js';

        // === 1. Setup ===
        const H = 8;
        const FLOOR_Y = -H / 2;            // úroveň "podlahy" v rest pose (kde stojí chodidla)
        const skel  = new Skeleton(H);
        const view  = new StickmanView(skel);
        const scene = new BasicScene({ cameraHeight: 0, cameraDistance: 18 });
        scene.scene.add(view.group);

        // CoM marker — přidáme do scény (NE do view.group, jeho pozice je world)
        const comMarker = view.createCenterOfMassMarker(FLOOR_Y);
        scene.scene.add(comMarker);

        // === 2. Pózy ===
        function makePose(name, angles, rootPos = null) {
            const p = new Pose(name);
            p.angles = angles;
            if (rootPos) p.rootPosition = rootPos;
            return p;
        }

        const POSES = {
            stand: makePose('Stand', {}),

            tpose: makePose('T-pose', {
                shoulderL: { x: 0, z: 90 },
                shoulderR: { x: 0, z: 90 },
            }),

            // Pravá ruka nad hlavou — CoM se posune doprava
            wave: makePose('Wave', {
                shoulderR: { x: 0, z: 160 },
                elbowR:    { x: 90 },
                neck:      { x: 0, z: -10 },
            }),

            // Sed — CoM klesne (těžiště níž), předkop přesune trup
            sit: makePose('Sit', {
                hipL:  { x: 90 },
                hipR:  { x: 90 },
                kneeL: { x: 90 },
                kneeR: { x: 90 },
                neck:  { x: 15 },
                shoulderL: { x: 30 },
                shoulderR: { x: 30 },
                elbowL: { x: 60 },
                elbowR: { x: 60 },
            }),

            // Předklon — CoM výrazně dopředu (mimo nohy → nestabilní)
            forward_lean: makePose('Předklon', {
                hipL: { x: 80 },
                hipR: { x: 80 },
                shoulderL: { x: -30, z: 5 },     // ruce dozadu pro vyvážení
                shoulderR: { x: -30, z: 5 },
                neck: { x: 30 },
            }),

            // Stoj na 1 noze — uvidíme, jestli CoM zůstává nad nohou
            one_leg: makePose('Stoj na 1 noze', {
                hipR:  { x: 30, z: 30 },         // pravá noha mírně do strany a dopředu
                kneeR: { x: 60 },                // a pokrčená
                shoulderL: { x: 0, z: 80 },      // ruce do stran pro rovnováhu
                shoulderR: { x: 0, z: 80 },
            }),
        };

        // === 3. UI ===
        const ui = document.getElementById('controls');
        const statsEl = document.getElementById('stats');
        const buttons = {};
        let current = 'stand';

        function activate(key) {
            const pose = POSES[key];
            pose.apply(skel);
            view.update();
            view.updateCenterOfMassMarker(comMarker);
            updateStats();
            current = key;
            Object.values(buttons).forEach(b => b.classList.remove('active'));
            buttons[key].classList.add('active');
        }

        function updateStats() {
            const com = skel.getCenterOfMass();
            const pose = POSES[current];
            statsEl.innerHTML = `
                <strong>Aktivní:</strong> ${pose.name}<br>
                <strong>CoM:</strong> <span class="com">
                  x=${com.x.toFixed(2)}  y=${com.y.toFixed(2)}  z=${com.z.toFixed(2)}
                </span>
            `;
        }

        Object.entries(POSES).forEach(([key, pose]) => {
            const btn = document.createElement('button');
            btn.textContent = pose.name;
            btn.addEventListener('click', () => activate(key));
            ui.appendChild(btn);
            buttons[key] = btn;
        });

        // === 4. Smyčka ===
        scene.onUpdate(() => {
            view.update();
            view.updateCenterOfMassMarker(comMarker);
        });
        scene.start();
        activate('stand');
    </script>
</body>
</html>
