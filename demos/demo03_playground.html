<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 03 — DOF playground</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }

        /* === Layout: vlevo viewport, vpravo panel === */
        #app      { display: flex; height: 100vh; width: 100vw; }
        #viewport { flex: 1; position: relative; min-width: 0; }
        #panel    { width: 360px; background: #22222b; border-left: 1px solid #444;
                    overflow-y: auto; padding: 16px 18px; box-sizing: border-box; }

        /* Hlavička v rohu viewportu */
        #info { position: absolute; top: 10px; left: 10px;
                pointer-events: none; text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 2px 0; font-size: 1.1em; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.85em; }

        /* === Panel === */
        #panel h1 { color: #ffaa66; font-size: 1.1em; margin: 0 0 14px 0; }
        .group    { margin-bottom: 14px; padding-bottom: 10px;
                    border-bottom: 1px solid #333; }
        .group h3 { margin: 0 0 6px 0; color: #ffaa66; font-size: 0.95em;
                    text-transform: uppercase; letter-spacing: 0.5px; }
        .row { display: flex; align-items: center; margin: 4px 0; gap: 8px;
               font-size: 0.82em; }
        .row label { width: 90px; color: #ccc; }
        .row input[type=range] { flex: 1; min-width: 0; accent-color: #ffaa66; }
        .row .value { width: 48px; text-align: right; font-family: monospace;
                      color: #88ccff; }
        .row .lim   { color: #666; font-size: 0.75em; font-family: monospace; }

        button.action {
            width: 100%; padding: 10px; background: #444; color: #fff;
            border: 0; border-radius: 4px; cursor: pointer; margin-top: 8px;
            font-size: 0.9em;
        }
        button.action:hover { background: #ffaa66; color: #1a1a22; }
    </style>
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
<div id="app">
    <div id="viewport">
        <div id="info">
            <h2>Demo 03 — Playground</h2>
            <p>Posuvníky vpravo ovládají všech 17 DOF + globální parametry.</p>
        </div>
    </div>
    <div id="panel">
        <h1>Nastavení postavy</h1>
        <!-- skupiny se generují dynamicky -->
    </div>
</div>

<script type="module">
    import { Skeleton }     from '../src/model/Skeleton.js';
    import { StickmanView } from '../src/view/StickmanView.js';
    import { BasicScene }   from '../src/scene/BasicScene.js';

    // =========================================================================
    // 1. Scéna v levém viewportu
    // =========================================================================
    const viewport = document.getElementById('viewport');
    const scene = new BasicScene({
        cameraHeight: 0,
        cameraDistance: 18,
        container: viewport,
    });

    // =========================================================================
    // 2. Model + view (mutable — přebudují se při změně H)
    // =========================================================================
    let H    = 8;
    let skel = new Skeleton(H);
    let view = new StickmanView(skel);
    scene.scene.add(view.group);
    scene.onUpdate(() => view.update());
    scene.start();

    // Přebuduje kostru a view na novou výšku, zachová úhly + root transformaci
    function rebuildSkeleton() {
        // Snapshot úhlů a root transformace ze staré kostry
        const oldAngles = {};
        skel.forEachJoint(j => {
            if (j.dof > 0) {
                oldAngles[j.name] = { ...j.angles };
            }
        });
        const oldRootPos = { ...skel.rootPosition };
        const oldRootRot = { ...skel.rootRotation };

        // Odstranit staré view ze scény
        scene.scene.remove(view.group);

        // Postavit nové
        skel = new Skeleton(H);
        view = new StickmanView(skel);
        scene.scene.add(view.group);

        // Aplikovat zachované hodnoty
        for (const [name, angles] of Object.entries(oldAngles)) {
            const j = skel.getJoint(name);
            j.axes.forEach(ax => j.setAngle(ax, angles[ax] || 0));
        }
        skel.rootPosition = oldRootPos;
        skel.rootRotation = oldRootRot;
        view.update();
    }

    // =========================================================================
    // 3. Generování UI panelu
    // =========================================================================
    const panel = document.getElementById('panel');

    // Helper: vyrobí jeden řádek se sliderem.
    // 'getter/setter' = funkce, jak číst a zapisovat hodnotu (kvůli rebuild při H).
    function addSlider(group, label, min, max, step, getValue, setValue) {
        const row = document.createElement('div');
        row.className = 'row';
        const value = getValue();
        row.innerHTML = `
            <label>${label}</label>
            <input type="range" min="${min}" max="${max}" step="${step}" value="${value}">
            <span class="value">${value.toFixed(step < 1 ? 1 : 0)}</span>
        `;
        const input = row.querySelector('input');
        const valueEl = row.querySelector('.value');
        input.addEventListener('input', () => {
            const v = parseFloat(input.value);
            setValue(v);
            valueEl.textContent = v.toFixed(step < 1 ? 1 : 0);
            view.update();
        });
        group.appendChild(row);
        // Vrátíme ovládací prvek pro reset
        return { input, valueEl, step, defaultValue: value, getValue, setValue };
    }

    // Helper: vyrobí skupinu (h3 + slidery)
    function addGroup(title) {
        const g = document.createElement('div');
        g.className = 'group';
        const h = document.createElement('h3');
        h.textContent = title;
        g.appendChild(h);
        panel.appendChild(g);
        return g;
    }

    const allSliders = [];   // pro reset

    // --- Skupina: Postava (globální) ---
    {
        const g = addGroup('Postava');
        // Výška H — speciální: triggeruje rebuild
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <label>Výška H</label>
            <input type="range" min="4" max="16" step="0.5" value="${H}">
            <span class="value">${H.toFixed(1)}</span>
        `;
        const input = row.querySelector('input');
        const valueEl = row.querySelector('.value');
        input.addEventListener('input', () => {
            H = parseFloat(input.value);
            valueEl.textContent = H.toFixed(1);
            rebuildSkeleton();
        });
        g.appendChild(row);

        // Root pozice (x, y, z)
        ['x', 'y', 'z'].forEach(axis => {
            allSliders.push(addSlider(g, `Root pos ${axis.toUpperCase()}`, -8, 8, 0.1,
                () => skel.rootPosition[axis],
                (v) => { skel.rootPosition[axis] = v; }
            ));
        });
        // Root rotace (x, y, z) — Three.js stupně, tj. nejde o anatomické úhly
        ['x', 'y', 'z'].forEach(axis => {
            allSliders.push(addSlider(g, `Root rot ${axis.toUpperCase()}`, -180, 180, 1,
                () => skel.rootRotation[axis],
                (v) => { skel.rootRotation[axis] = v; }
            ));
        });
    }

    // --- Skupiny pro klouby ---
    // Pomocná funkce: pro daný kloub vyrobí slidery podle jeho aktivních os a limitů.
    function addJointSliders(group, jointName) {
        const j = skel.getJoint(jointName);
        j.axes.forEach(axis => {
            const [min, max] = j.limits[axis];
            const label = `${jointName}.${axis}`;
            const slider = addSlider(group, label, min, max, 1,
                () => skel.getJoint(jointName).getAngle(axis),
                (v) => { skel.setAngle(jointName, axis, v); }
            );
            // Doplníme info o limitech vedle labelu
            const lim = document.createElement('span');
            lim.className = 'lim';
            lim.textContent = `[${min}…${max}]`;
            slider.input.parentElement.querySelector('label').title = `Limity: ${min}° až ${max}°`;
            allSliders.push(slider);
        });
    }

    // Trup (R3a) — ohyb v pase, body roll, lateral flexe
    { const g = addGroup('Trup');        addJointSliders(g, 'torso'); }
    // Krk
    { const g = addGroup('Krk');         addJointSliders(g, 'neck'); }
    // Levá paže
    { const g = addGroup('Levá paže');
      addJointSliders(g, 'shoulderL');   addJointSliders(g, 'elbowL'); }
    // Pravá paže
    { const g = addGroup('Pravá paže');
      addJointSliders(g, 'shoulderR');   addJointSliders(g, 'elbowR'); }
    // Levá noha
    { const g = addGroup('Levá noha');
      addJointSliders(g, 'hipL');        addJointSliders(g, 'kneeL'); }
    // Pravá noha
    { const g = addGroup('Pravá noha');
      addJointSliders(g, 'hipR');        addJointSliders(g, 'kneeR'); }

    // --- Reset tlačítko ---
    const resetBtn = document.createElement('button');
    resetBtn.className = 'action';
    resetBtn.textContent = 'Reset všech sliderů';
    resetBtn.addEventListener('click', () => {
        // Resetuje úhly, root, ale NE výšku H (ta je řízená separátně)
        skel.reset();
        allSliders.forEach(s => {
            const v = s.getValue();
            s.input.value = v;
            s.valueEl.textContent = v.toFixed(s.step < 1 ? 1 : 0);
        });
        view.update();
    });
    panel.appendChild(resetBtn);
</script>
</body>
</html>
