<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Demo 07 — Auto-balance (snap k podlaze)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a22;
               font-family: sans-serif; color: #ddd; }
        #info { position: absolute; top: 10px; left: 0; right: 0;
                text-align: center; pointer-events: none;
                text-shadow: 1px 1px 2px black; }
        #info h2 { margin: 0 0 4px 0; }
        #info p  { margin: 0; opacity: 0.7; font-size: 0.9em; }
        #controls, #panel {
            position: absolute; top: 80px; padding: 12px 16px;
            background: #2a2a35; border: 1px solid #444; border-radius: 6px;
            z-index: 100;
        }
        #controls { right: 20px; display: flex; flex-direction: column; gap: 4px; padding: 0; background: none; border: none; }
        #panel    { left: 20px; min-width: 220px; }
        #stats { position: absolute; bottom: 10px; left: 10px;
                 background: rgba(0,0,0,0.55); padding: 10px 14px;
                 border-radius: 6px; font-size: 0.85em; line-height: 1.55;
                 min-width: 240px; }
        .ok   { color: #44ff66; font-weight: bold; }
        .bad  { color: #ff4444; font-weight: bold; }
        .com    { color: #44ff66; font-family: monospace; }
        .anchor { color: #ffaa44; font-family: monospace; }
        .floor  { color: #88ccff; font-family: monospace; }
    </style>
    <script type="importmap">
    { "imports": {
        "three":          "https://cdn.jsdelivr.net/npm/three@0.170/build/three.module.js",
        "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.170/examples/jsm/"
    }}
    </script>
</head>
<body>
    <div id="info">
        <h2>Demo 07 — Auto-balance</h2>
        <p>Vlevo přepni "Snap" — postava se buď drží podlahy, nebo visí ve vzduchu.</p>
    </div>

    <div id="panel"></div>
    <div id="controls"></div>
    <div id="stats"></div>

    <script type="module">
        import { Skeleton }     from '../src/model/Skeleton.js';
        import { StickmanView } from '../src/view/StickmanView.js';
        import { BasicScene }   from '../src/scene/BasicScene.js';
        import { stand, tpose, squat, sitLegsForward, oneLegL, lunge } from '../src/library/Poses.js';
        import { addToggle, addButtonGroup, injectStyles } from '../src/util/DemoUI.js';

        injectStyles();

        // === 1. Setup ===
        const H = 8;
        const FLOOR_Y = -H / 2;
        const skel  = new Skeleton(H);
        const view  = new StickmanView(skel);
        const scene = new BasicScene({
            cameraHeight: 0, cameraDistance: 18,
            floorY: FLOOR_Y,
        });
        scene.scene.add(view.group);

        const comMarker     = view.createCenterOfMassMarker(FLOOR_Y);
        const supportMarker = view.createSupportPolygonMarker(FLOOR_Y);
        scene.scene.add(comMarker);
        scene.scene.add(supportMarker);

        // === 2. Pózy z knihovny ===
        const POSES = {
            stand,
            tpose,
            squat,
            sit_legs_fwd: sitLegsForward,
            one_leg_L:    oneLegL,
            lunge,
        };

        // === 3. Stav ===
        let snapEnabled = true;
        let currentKey = 'stand';

        function applyCurrent() {
            POSES[currentKey].apply(skel);
            if (snapEnabled) skel.snapToFloor(FLOOR_Y);
            view.update();
            view.updateCenterOfMassMarker(comMarker, true);
            view.updateSupportPolygonMarker(supportMarker);
            updateStats();
        }

        function updateStats() {
            const com = skel.getCenterOfMass();
            const stable = skel.isStable();
            const sp = skel.supportPoints.join(', ');
            const pose = POSES[currentKey];
            statsEl.innerHTML = `
                <div><strong>Aktivní:</strong> ${pose.name}</div>
                <div><strong>Stabilita:</strong>
                    <span class="${stable ? 'ok' : 'bad'}">${stable ? 'STABILNÍ' : 'PADÁ'}</span></div>
                <div><strong>Snap:</strong> ${snapEnabled ? 'ON' : 'OFF'}</div>
                <div><strong>Root.y:</strong> <span class="floor">${skel.rootPosition.y.toFixed(2)}</span>
                  &nbsp;<strong>floor:</strong> <span class="floor">${FLOOR_Y.toFixed(2)}</span></div>
                <div><strong>CoM (xz):</strong> <span class="com">x=${com.x.toFixed(2)}, z=${com.z.toFixed(2)}</span></div>
                <div><strong>Body opory:</strong> <span class="anchor">${sp}</span></div>
            `;
        }

        // === 4. UI přes DemoUI helpery ===
        const statsEl = document.getElementById('stats');
        const panel   = document.getElementById('panel');

        addToggle(panel, {
            label: 'Snap to floor',
            value: snapEnabled,
            onChange: (on) => { snapEnabled = on; applyCurrent(); },
        });

        addButtonGroup(
            document.getElementById('controls'),
            Object.entries(POSES).map(([key, pose]) => ({ key, label: pose.name })),
            (key) => { currentKey = key; applyCurrent(); },
            'stand'
        );

        scene.onUpdate(() => view.update());
        scene.start();
    </script>
</body>
</html>
